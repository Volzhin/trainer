name: Деплой на сервер

# Единственный путь в прод — пуш в main. Ручная выкладка не предполагается:
# иначе на сервере оказывается код, которого нет в репозитории.
#
# Публикация на GitHub Pages убрана намеренно: страница отдавалась из США,
# а по 242-ФЗ данные российских пользователей должны обрабатываться в РФ.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Версии major-тегом: патчи приезжают сами. Начиная с v5 экшены
      # крутятся на Node 24 — на v4 GitHub уже ругался, что Node 20 снят
      # с поддержки и запускается принудительно на 24.
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Проверка типов
        run: npx tsc -b

      - name: Сборка
        run: npm run build
        env:
          BASE_PATH: /

      # Отпечаток сервера берётся из секрета, а не собирается заново каждый
      # раз: keyscan доверяет тому, кто ответил, и посредник между раннером и
      # сервером получил бы и доступ, и пароль администратора базы.
      # Снять отпечаток: ssh-keyscan -H <хост> — и положить в SSH_KNOWN_HOSTS.
      - name: Ключ доступа к серверу
        env:
          KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if [ -n "$KNOWN_HOSTS" ]; then
            echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::SSH_KNOWN_HOSTS не задан — ключ хоста принимается на веру"
            ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Выкладка приложения
        run: rsync -az --delete dist/ root@${{ secrets.DEPLOY_HOST }}:/opt/trainer/web/

      # Серверные обработчики: погашение кода приглашения делает сервер,
      # поэтому список приглашений закрыт даже для вошедших.
      - name: Серверные обработчики
        run: |
          rsync -az server/pb_hooks/ root@${{ secrets.DEPLOY_HOST }}:/opt/trainer/pb/pb_hooks/
          ssh root@${{ secrets.DEPLOY_HOST }} 'systemctl restart trainer-pb && sleep 3'

      # Схема применяется после статики: скрипт идемпотентен, и повторный
      # запуск на неизменившейся схеме ничего не делает.
      # Пароль уходит потоком, а не в строке команды: аргументы удалённого
      # процесса видит на сервере любой через ps, окружение — только root.
      - name: Схема базы
        env:
          PB_ADMIN_EMAIL: ${{ secrets.PB_ADMIN_EMAIL }}
          PB_ADMIN_PASSWORD: ${{ secrets.PB_ADMIN_PASSWORD }}
        run: |
          scp server/schema.mjs root@${{ secrets.DEPLOY_HOST }}:/opt/trainer/schema.mjs
          printf '%s\n%s\n' "$PB_ADMIN_EMAIL" "$PB_ADMIN_PASSWORD" |
            ssh root@${{ secrets.DEPLOY_HOST }} \
              'read -r EMAIL; read -r PASSWORD;
               PB_ADMIN_EMAIL="$EMAIL" PB_ADMIN_PASSWORD="$PASSWORD" \
                 PB_RATE_LIMITS=on \
                 node /opt/trainer/schema.mjs'

      - name: Проверка живости
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://${{ secrets.DEPLOY_DOMAIN }}/api/health")
          echo "api: $code"
          test "$code" = "200"
