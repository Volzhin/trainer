# Разовая проверка: доступен ли бэкенд в обход nginx.
#
# Запускается только руками (workflow_dispatch) и ничего не меняет — читает
# список слушающих портов на сервере и пробует достучаться до бэкенда снаружи,
# с раннера. Удаляется сразу после проверки.
name: Проверка портов

on: workflow_dispatch

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Ключ доступа
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Что слушает сервер
        run: |
          ssh -o StrictHostKeyChecking=no root@${{ secrets.DEPLOY_HOST }} \
            'ss -ltnp | grep -E "8090|nginx" || echo "8090 не слушается"'

      - name: Виден ли бэкенд снаружи
        run: |
          # Раннер GitHub — обычная точка в интернете, то есть проверка идёт
          # ровно с той стороны, откуда пришёл бы посторонний.
          if timeout 8 bash -c "</dev/tcp/${{ secrets.DEPLOY_HOST }}/8090"; then
            echo "ОТКРЫТ снаружи — обход nginx возможен"
          else
            echo "закрыт снаружи"
          fi
